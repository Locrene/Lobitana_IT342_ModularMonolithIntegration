spring.application.name=modularmonolith
# Reads the project-root .env (which is gitignored) so LS_API_KEY resolves without
# exporting it by hand. Both paths are optional: one matches running from the repo
# root, the other from backend/. A real environment variable still wins.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.lvalvpttswoceejywkzp
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Lab 2
inventory.low-stock-threshold=5
server.error.include-message=always

# ---------------------------------------------------------------------------
# Lab 3: LegacySupply
# ---------------------------------------------------------------------------
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=23-5497-731
# Never hardcoded: comes from the LS_API_KEY environment variable or the gitignored .env.
legacysupply.api-key=${LS_API_KEY}

legacysupply.session-path=/auth/token
legacysupply.orders-path=/purchase-orders
legacysupply.order-by-ref-path=/purchase-orders?buyerRef={ref}
legacysupply.order-status-path=/purchase-orders/{po}

# The client id and API key are not headers: they go in the <AuthRequest> XML body.
legacysupply.session-header=X-LS-Session
legacysupply.request-id-header=X-Request-Id

# Resilience
legacysupply.timeout-ms=3000
legacysupply.max-attempts=3
legacysupply.backoff-ms=300

# FILL IN with the session lifetime you measured in Part B
legacysupply.session-ttl-seconds=300
legacysupply.session-refresh-margin-seconds=30

# Scheduled jobs. Batch size is what keeps us inside the request quota.
legacysupply.retry-job.interval-ms=60000
legacysupply.retry-job.initial-delay-ms=30000
legacysupply.retry-job.batch-size=5
legacysupply.status-job.interval-ms=120000
legacysupply.status-job.initial-delay-ms=45000
legacysupply.status-job.batch-size=5

# Product mapping, taken from GET /catalog on 2026-09-24.
# P100 Wireless Mouse       -> WIRELESS MOUSE 2.4GHZ
legacysupply.products.P100.sku=GJJ-6351
legacysupply.products.P100.pack-size=24
legacysupply.products.P100.uom=CS
# P200 Mechanical Keyboard  -> KEYBOARD MECH TKL
legacysupply.products.P200.sku=GJJ-7266
legacysupply.products.P200.pack-size=12
legacysupply.products.P200.uom=CS
# P300 USB-C Hub            -> USB HUB 4-PORT (not GJJ-4152, which is a USB-C cable)
legacysupply.products.P300.sku=GJJ-7179
legacysupply.products.P300.pack-size=6
legacysupply.products.P300.uom=CS

# LegacySupply status code -> our status. Anything not listed becomes UNKNOWN,
# which stays open and keeps being polled, and never restocks anything.
legacysupply.status-map.10=CONFIRMED
legacysupply.status-map.20=PICKING
legacysupply.status-map.30=SHIPPED
legacysupply.status-map.40=DELIVERED

# Top the shelf back up to this many units when a low-stock event fires.
supplier.reorder-target-units=20
